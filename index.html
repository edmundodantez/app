<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InvestCalc — Real Estate Cashflow</title>
  <meta name="description" content="Modelo multi-deal de cashflow imobiliário: terreno, construção, draws, financiamento e venda.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InvestCalc">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>InvestCalc</h1>
    <p class="subtitle">Real estate cashflow — multi-deal</p>
  </header>

  <main>
    <section id="tab-dash" class="tab-panel" data-tab="dash"></section>
    <section id="tab-deals" class="tab-panel" data-tab="deals" hidden></section>
    <section id="tab-master" class="tab-panel" data-tab="master" hidden></section>
    <section id="tab-config" class="tab-panel" data-tab="config" hidden></section>
  </main>

  <nav class="tab-bar" role="tablist" aria-label="Seções">
    <button class="tab-btn active" role="tab" aria-selected="true" data-target="dash">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab-btn" role="tab" aria-selected="false" data-target="deals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9h14v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Deals</span>
    </button>
    <button class="tab-btn" role="tab" aria-selected="false" data-target="master">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Cashflow</span>
    </button>
    <button class="tab-btn" role="tab" aria-selected="false" data-target="config">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.7a7 7 0 0 0-2.1 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.1 1.2L10 21h4l.5-2.7a7 7 0 0 0 2.1-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div class="chart-tooltip" id="tooltip" hidden></div>

  <script src="model.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
